name: Deploy to GitHub Pages

# Pushes to main are tested and deployed. Run by hand on any other branch, the
# workflow only tests it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch at a time; a newer push waits for the running one to finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Google Chrome ships with the runner (see playwright.config.ts). Firefox
      # and WebKit, the engine of Safari, are Playwright's own builds.
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: End-to-end tests
        run: npx playwright test
        env:
          SCREENSHOT_DIR: screenshots

      # What the screens look like in each browser, for a look by eye.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
